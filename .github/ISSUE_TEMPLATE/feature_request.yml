name: 💡 Feature Request
description: Propose an awesome new clustering algorithm, UI upgrade, or export format.
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ### Propose a New Feature for Face-Sort-Studio! ✨
        We love making photo organization faster and more powerful. Let us know what you have in mind!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: Is your feature request related to a specific photo sorting bottleneck?
      placeholder: e.g. I want to export grouped faces directly as symlinks instead of copying files...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the UI workflow or backend feature you think would work best.
      placeholder: e.g. Add a toggle in the UI settings for 'Export mode: Copy / Move / Symlink'...
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Willing to Contribute?
      options:
        - label: I am willing to submit a pull request to implement this feature!
          required: false
